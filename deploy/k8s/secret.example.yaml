# NOT applied by kustomize. Create the real secret out-of-band (or with External Secrets / AWS Secrets Manager):
#
#   kubectl -n docpilot create secret generic docpilot-secrets \
#     --from-literal=DOCPILOT_DATABASE_URL="postgresql+psycopg://USER:PASS@your-rds-host:5432/docpilot" \
#     --from-literal=DOCPILOT_JWT_SECRET="<long random string>" \
#     --from-literal=ANTHROPIC_API_KEY="<your key>" \
#     --from-literal=DOCPILOT_SMTP_USER="<smtp user>" \
#     --from-literal=DOCPILOT_SMTP_PASSWORD="<smtp password>"
apiVersion: v1
kind: Secret
metadata:
  name: docpilot-secrets
type: Opaque
stringData:
  DOCPILOT_DATABASE_URL: postgresql+psycopg://docpilot:CHANGE_ME@postgres:5432/docpilot
  DOCPILOT_JWT_SECRET: CHANGE_ME_TO_A_LONG_RANDOM_VALUE
  ANTHROPIC_API_KEY: ""
  DOCPILOT_SMTP_USER: ""
  DOCPILOT_SMTP_PASSWORD: ""
