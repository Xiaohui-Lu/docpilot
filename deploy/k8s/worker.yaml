apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: docpilot, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: docpilot, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: docpilot, app.kubernetes.io/component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      # Let in-flight LLM calls finish; anything unfinished is re-queued by the job lock timeout.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: docpilot-api
          command: ["python", "-m", "app.worker"]
          ports: [{ name: metrics, containerPort: 9100 }]
          envFrom:
            - configMapRef: { name: docpilot-config }
            - secretRef: { name: docpilot-secrets }
          livenessProbe:
            tcpSocket: { port: metrics }
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
