global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: docpilot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: docpilot-worker
    dns_sd_configs: # discovers every worker replica
      - names: ["worker"]
        type: A
        port: 9100
